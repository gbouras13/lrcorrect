{% set name = "lrcorrect" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/gbouras13/lrcorrect/archive/refs/tags/v{{ version }}.tar.gz
  sha256: REPLACE_WITH_RELEASE_TARBALL_SHA256

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - make
  host:
    - zlib

test:
  commands:
    - lrcorrect --version
    - lrcorrect --help

about:
  home: https://github.com/gbouras13/lrcorrect
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Fast, deterministic self-correction of small long-read sets (plasmids, small genomes)

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
